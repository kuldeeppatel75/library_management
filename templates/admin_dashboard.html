{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card shadow p-4">
                    <h2 class="mb-4">Library Admin Dashboard</h2>
                    <hr>
                    <div class="row mt-4">
                        <div class="col-md-6 mb-3">
                            <div class="card bg-primary text-white p-3">
                                <h3>Approved Students</h3>
                                <p class="fs-4">{{ approved_count }}</p>
                                <a href="{% url 'admin_approved' %}" class="btn btn-light text-primary fw-bold">View Approved List</a>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card bg-warning text-dark p-3">
                                <h3>Pending Students</h3>
                                <p class="fs-4">{{ pending_count }}</p>
                                <a href="{% url 'admin_pending' %}" class="btn btn-dark text-white fw-bold">View Pending List</a>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
