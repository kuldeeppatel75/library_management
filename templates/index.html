{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/index.css' %}">

{% endblock  %}

{% block content %}
<!-- Load Page Specific CSS -->

<!-- Include Modular Hero Section -->
{% include 'hero.html' %}
<!-- Statistics / Feature Cards Row -->
<div class="container">
    <div class="row g-4 mt-4 mb-5">
        <div class="col-md-4">
            <div class="stats-card">
                <i class="bi bi-journal-bookmark-fill"></i>
                <div class="stats-number">1,250+</div>
                <div class="stats-label">Total Books</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-card">
                <i class="bi bi-people-fill"></i>
                <div class="stats-number">{{ approved_count }}+</div>
                <div class="stats-label">Active Members</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-card">
                <i class="bi bi-arrow-left-right"></i>
                <div class="stats-number">85+</div>
                <div class="stats-label">Issued Today</div>
            </div>
        </div>
    </div>
</div>
<!-- Floating Social Media Widgets -->
    <div class="social-floating-box">
        <!-- WhatsApp -->
        <a href="https://wa.me/916390657554" target="_blank" class="social-icon whatsapp" title="Chat on WhatsApp">
            <i class="bi bi-whatsapp"></i>
        </a>
        <!-- Instagram -->
        <a href="https://instagram.com/@kuldeep_patel4/" target="_blank" class="social-icon instagram" title="Follow on Instagram">
            <i class="bi bi-instagram"></i>
        </a>
        <!-- LinkedIn -->
        <a href="https://linkedin.com/in/YOUR_LINKEDIN_ID" target="_blank" class="social-icon linkedin" title="Connect on LinkedIn">
            <i class="bi bi-linkedin"></i>
        </a>
    </div>

{% endblock %}
