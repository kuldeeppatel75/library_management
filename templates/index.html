{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Load Page Specific CSS -->
<link rel="stylesheet" href="{% static 'css/index.css' %}">

<!-- Include Modular Hero Section -->
{% include 'hero.html' %}

<!-- Statistics / Feature Cards Row -->
<div class="container">
    <div class="row g-4 mt-4 mb-5">
        <div class="col-md-4">
            <div class="stats-card">
                <i class="bi bi-journal-bookmark-fill"></i>
                <div class="stats-number">1,250+</div>
                <div class="stats-label">Total Books</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-card">
                <i class="bi bi-people-fill"></i>
                <div class="stats-number">450+</div>
                <div class="stats-label">Active Members</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-card">
                <i class="bi bi-arrow-left-right"></i>
                <div class="stats-number">85+</div>
                <div class="stats-label">Issued Today</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
