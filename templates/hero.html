{% load static %}
<!-- Professional Hero Section with Online HD Library Image Slider -->
<div class="container">
    <div class="hero-slider-section">

        <!-- Background Sliding Images via Direct Links -->
        <div id="libraryHeroCarousel" class="carousel slide carousel-fade hero-bg-carousel" data-bs-ride="carousel" data-bs-interval="4000">
            <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                    <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1600&q=80" alt="Library View 1">
                </div>
                <div class="carousel-item h-100">
                    <img src="https://images.unsplash.com/photo-1507842229432-152a5504746f?auto=format&fit=crop&w=1600&q=80" alt="Library View 2">
                </div>
                <div class="carousel-item h-100">
                    <img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&w=1600&q=80" alt="Library View 3">
                </div>
            </div>
        </div>

        <!-- Foreground Professional Content -->
        <div class="hero-content-wrapper row align-items-center">
            <div class="col-lg-7">
                <h1 class="hero-title animated-slide-title">Welcome to <span>Shrishti Library</span></h1>
                <p class="hero-desc">Experience next-level library management with automated tracking, lightning-fast book searches, and a fully professional digital ecosystem.</p>
                <a href="#" class="btn pro-btn"><i class="bi bi-compass"></i> Explore Books</a>
            </div>
            <div class="col-lg-5 text-center mt-4 mt-lg-0">
                <div class="p-4 bg-dark bg-opacity-75 rounded-4 border border-secondary shadow-lg backdrop-blur">
                    <i class="bi bi-shield-check text-info display-4"></i>
                    <h4 class="text-white mt-3">Secure & Reliable</h4>
                    <p class="text-muted small mb-0">Role-based access control with robust database architecture.</p>
                </div>
            </div>
        </div>

    </div>
</div>
