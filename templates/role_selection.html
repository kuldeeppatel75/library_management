{% extends 'base.html' %}
{% load static %}
{% block content %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/role_selection.css' %}">
{% endblock  %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card p-4 p-md-5 bg-dark rounded-4 border border-secondary shadow-lg text-white text-center" style="width: 100%; max-width: 480px;">
        
        <!-- Header -->
        <div class="mb-4">
            <div class="mb-3 text-info">
                <i class="bi bi-person-badge fs-1"></i>
            </div>
            <h3 class="fw-bold mb-2 text-white">Select Your Role</h3>
            <p class="text-light opacity-75 small mb-0">Where you want to Login ?</p>
        </div>

        <!-- Role Selection Buttons -->
        <div class="d-grid gap-3 my-3">
            <a href="{% url 'login_page' %}" class="btn btn-outline-info py-3 fw-bold text-white d-flex align-items-center justify-content-center gap-2 shadow-sm text-decoration-none rounded-3" style="border-width: 2px;">
                <i class="bi bi-mortarboard-fill fs-5"></i> Student Login
            </a>
            
            <a href="{% url 'admin_login' %}" class="btn btn-outline-warning py-3 fw-bold text-white d-flex align-items-center justify-content-center gap-2 shadow-sm text-decoration-none rounded-3" style="border-width: 2px;">
             <i class="bi bi-shield-shaded fs-5"></i> Admin Login
            </a>
        </div>

        <div class="mt-3">
            <small class="text-muted">Choose appropriate portal to proceed</small>
        </div>

    </div>
</div>
{% endblock %}
