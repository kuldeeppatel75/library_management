{% extends 'base.html' %}
{% block content %}
<style>
    body {
        background-color: #0f172a !important;
    }
</style>
<div class="container my-5" style="max-width: 450px;">
    <div class="p-4 bg-dark rounded-4 border border-secondary shadow-lg text-white">
        <h3 class="text-center mb-3">Set Your <span>Password</span></h3>
        <p class="text-muted small text-center">Pehli baar login kar rahe hain, kripya apna naya password set karein.</p>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="new_password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Password Save Karke Login Karein</button>
        </form>
    </div>
</div>
{% endblock %}
