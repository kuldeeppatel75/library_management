{% extends 'base.html' %}

{% block content %}

<style>
    /* ===== Professional Login Page ===== */

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at 15% 20%, rgba(13, 202, 240, 0.12), transparent 28%),
            radial-gradient(circle at 85% 80%, rgba(111, 66, 193, 0.14), transparent 30%),
            linear-gradient(135deg, #080b12 0%, #101722 50%, #080b12 100%);
        position: relative;
        overflow-x: hidden;
    }

    /* Soft background glow */
    body::before {
        content: "";
        position: fixed;
        width: 320px;
        height: 320px;
        top: -120px;
        right: -100px;
        background: rgba(13, 202, 240, 0.10);
        filter: blur(80px);
        border-radius: 50%;
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        width: 300px;
        height: 300px;
        bottom: -120px;
        left: -100px;
        background: rgba(99, 102, 241, 0.10);
        filter: blur(80px);
        border-radius: 50%;
        pointer-events: none;
    }

    .container.my-5 {
        position: relative;
        z-index: 2;
    }

    /* Login Card */
    .card {
        background: rgba(20, 27, 38, 0.88) !important;
        border: 1px solid rgba(255, 255, 255, 0.10) !important;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        transform: translateY(-3px);
        box-shadow:
            0 30px 70px rgba(0, 0, 0, 0.55),
            0 0 35px rgba(13, 202, 240, 0.06) !important;
    }

    /* Shield Icon */
    .text-info .bi-shield-lock {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: rgba(13, 202, 240, 0.09);
        border: 1px solid rgba(13, 202, 240, 0.22);
        box-shadow: 0 0 30px rgba(13, 202, 240, 0.10);
    }

    /* Heading */
    h3 {
        letter-spacing: -0.3px;
    }

    /* Input Labels */
    .form-label {
        letter-spacing: 0.2px;
        margin-bottom: 8px;
    }

    /* Inputs */
    .form-control {
        background: rgba(48, 58, 72, 0.75) !important;
        border: 1px solid rgba(255, 255, 255, 0.10) !important;
        border-radius: 11px;
        color: #fff !important;
        min-height: 45px;
        transition: all 0.25s ease;
    }

    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.42);
    }

    .form-control:focus {
        background: rgba(48, 58, 72, 0.95) !important;
        border-color: rgba(13, 202, 240, 0.70) !important;
        box-shadow: 0 0 0 3px rgba(13, 202, 240, 0.10) !important;
    }

    /* Login Button */
    .btn-info {
        border: none;
        border-radius: 11px;
        min-height: 46px;
        background: linear-gradient(135deg, #0dcaf0, #22d3ee) !important;
        box-shadow: 0 8px 22px rgba(13, 202, 240, 0.18) !important;
        transition: all 0.25s ease;
    }

    .btn-info:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #22d3ee, #0dcaf0) !important;
        box-shadow: 0 12px 28px rgba(13, 202, 240, 0.28) !important;
    }

    .btn-info:active {
        transform: translateY(0);
    }

    /* Error Alert */
    .alert-danger {
        border-radius: 10px;
        background: rgba(220, 53, 69, 0.16) !important;
        border: 1px solid rgba(220, 53, 69, 0.25) !important;
    }

    /* Mobile */
    @media (max-width: 576px) {
        .container.my-5 {
            margin-top: 2rem !important;
            margin-bottom: 2rem !important;
        }

        .card {
            padding: 1.5rem !important;
        }
    }
</style>

<div class="container my-5" style="max-width: 440px;">
    <div class="card p-4 p-md-5 bg-dark rounded-4 border border-secondary shadow-lg text-white">
        
        <!-- Professional Header -->
        <div class="text-center mb-4">
            <div class="mb-2 text-info">
                <i class="bi bi-shield-lock fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1 text-white">Student <span class="text-info">Login</span></h3>
            <p class="text-light opacity-75 small mb-0">Enter your credentials to continue</p>
        </div>
        
        {% if error %}
            <div class="alert alert-danger py-2 small mb-3 border-0 bg-danger text-white">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold">Registered Mobile Number</label>
                <input type="text" class="form-control bg-secondary text-white border-secondary shadow-none py-2" name="mobile" required autocomplete="off" placeholder="Enter Registered Mobile No.">
            </div>
            
            <div class="mb-4">
                <label class="form-label text-light small fw-semibold">Password</label>
                <input type="password" class="form-control bg-secondary text-white border-secondary shadow-none py-2" name="password" placeholder="Pehli baar aa rahe hain toh khali chhod dein" autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-info w-100 py-2 fw-bold text-dark shadow-sm">Login Karein</button>
        </form>
    </div>
</div>
{% endblock %}
