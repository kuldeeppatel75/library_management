{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock  %}

{% block content %}
<div class="container my-5" style="max-width: 440px;">
    <div class="card p-4 p-md-5 bg-dark rounded-4 border border-secondary shadow-lg text-white">
        
        <!-- Professional Header -->
        <div class="text-center mb-4">
            <div class="mb-2 text-info">
                <i class="bi bi-shield-lock fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1 text-white">Student <span class="text-info">Login</span></h3>
            <p class="text-light opacity-75 small mb-0">Enter your credentials to continue</p>
        </div>
        
        {% if error %}
            <div class="alert alert-danger py-2 small mb-3 border-0 bg-danger text-white">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold">Registered Mobile Number</label>
                <input type="text" class="form-control bg-secondary text-white border-secondary shadow-none py-2" name="mobile" required autocomplete="off" placeholder="Enter Registered Mobile No.">
            </div>
            
            <div class="mb-4">
                <label class="form-label text-light small fw-semibold">Password</label>
                <input type="password" class="form-control bg-secondary text-white border-secondary shadow-none py-2" name="password" placeholder="First time visit please empty this box" autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-info w-100 py-2 fw-bold text-dark shadow-sm">Login</button>
        </form>
    </div>
</div>
{% endblock %}
