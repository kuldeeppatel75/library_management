{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/contact_success.css' %}">
{% endblock  %}

{% block content %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-lg p-5 border-0 rounded-4 mt-5">
                    <div class="card-body">
                        <div class="mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#28a745" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                            </svg>
                        </div>
                        <h2 class="text-success fw-bold mb-3">Thank You!</h2>
                        <p class="text-muted fs-5 mb-4">Aapka message/complaint safalpurvak bhej diya gaya hai. Hum jald hi aapse sampark karenge.</p>
                        <a href="/contact/" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">Go Back to Contact</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
