<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    {% block extra_css %} {% endblock %}
</head>
<body>
    {% comment %} whatsapp crausel {% endcomment %}
 <div class="social-floating-box">
        <!-- WhatsApp -->
        <a href="https://wa.me/91YOUR_PHONE_NUMBER" target="_blank" class="social-icon whatsapp" title="Chat on WhatsApp">
            <i class="bi bi-whatsapp"></i>
        </a>
        <!-- Instagram -->
        <a href="https://instagram.com/YOUR_INSTAGRAM_ID" target="_blank" class="social-icon instagram" title="Follow on Instagram">
            <i class="bi bi-instagram"></i>
        </a>
        <!-- LinkedIn -->
        <a href="https://linkedin.com/in/YOUR_LINKEDIN_ID" target="_blank" class="social-icon linkedin" title="Connect on LinkedIn">
            <i class="bi bi-linkedin"></i>
        </a>
    </div>


    <!-- Professional Header Include -->
    {% include 'header.html' %}

    <!-- Dynamic Content Block -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
{% include "footer.html" %}
    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
